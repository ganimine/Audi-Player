<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141928"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#090D15"/>
    </linearGradient>

    <!-- Radial backdrop glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#34A853" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0E131F" stop-opacity="0"/>
    </radialGradient>

    <!-- Headband gradient -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="35%" stop-color="#4285F4"/>
      <stop offset="70%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#FBBC05"/>
    </linearGradient>

    <!-- Core vinyl disc gradient -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Drop shadow for play button -->
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Solid / Rounded Base Container -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="url(#ambientGlow)"/>

  <!-- Subtle outer border rim -->
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="#2D3748" stroke-width="2" stroke-opacity="0.4"/>

  <!-- HEADPHONES ARCH -->
  <!-- Outer metallic band -->
  <path d="M 145,260 C 145,150 190,105 256,105 C 322,105 367,150 367,260"
        fill="none" stroke="#64748B" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Colored inner band cushion (Google colors) -->
  <path d="M 165,200 C 185,140 215,120 256,120 C 297,120 327,140 347,200"
        fill="none" stroke="url(#headbandGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- LEFT EAR CUP -->
  <rect x="110" y="215" width="45" height="100" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="135" y="230" width="12" height="70" rx="6" fill="#34A853"/>
  <line x1="105" y1="235" x2="105" y2="295" stroke="#FBBC05" stroke-width="5" stroke-linecap="round"/>

  <!-- RIGHT EAR CUP -->
  <rect x="357" y="215" width="45" height="100" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="365" y="230" width="12" height="70" rx="6" fill="#EA4335"/>
  <line x1="407" y1="235" x2="407" y2="295" stroke="#4285F4" stroke-width="5" stroke-linecap="round"/>

  <!-- SOUNDWAVE BARS (Left channel) -->
  <rect x="175" y="240" width="8" height="36" rx="4" fill="#FBBC05"/>
  <rect x="190" y="225" width="8" height="66" rx="4" fill="#34A853"/>

  <!-- SOUNDWAVE BARS (Right channel) -->
  <rect x="314" y="225" width="8" height="66" rx="4" fill="#4285F4"/>
  <rect x="329" y="240" width="8" height="36" rx="4" fill="#EA4335"/>

  <!-- CENTRAL MUSIC DISC -->
  <!-- Outer deep backing -->
  <circle cx="256" cy="256" r="94" fill="#0B0F19"/>

  <!-- GOOGLE 4-COLOR SEGMENTED CIRCLE (R=94, stroke-width=18) -->
  <!-- Top-Right: Google Blue (#4285F4) -->
  <path d="M 256,162 A 94,94 0 0,1 350,256"
        fill="none" stroke="#4285F4" stroke-width="18" stroke-linecap="round"/>

  <!-- Bottom-Right: Google Red (#EA4335) -->
  <path d="M 350,256 A 94,94 0 0,1 256,350"
        fill="none" stroke="#EA4335" stroke-width="18" stroke-linecap="round"/>

  <!-- Bottom-Left: Google Yellow (#FBBC05) -->
  <path d="M 256,350 A 94,94 0 0,1 162,256"
        fill="none" stroke="#FBBC05" stroke-width="18" stroke-linecap="round"/>

  <!-- Top-Left: Google Green (#34A853) -->
  <path d="M 162,256 A 94,94 0 0,1 256,162"
        fill="none" stroke="#34A853" stroke-width="18" stroke-linecap="round"/>

  <!-- Inner vinyl core -->
  <circle cx="256" cy="256" r="70" fill="url(#discGrad)"/>
  <circle cx="256" cy="256" r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- PLAY BUTTON TRIANGLE -->
  <polygon points="236,212 300,256 236,300"
           fill="#FFFFFF" filter="url(#glowDrop)"/>

  <!-- Tiny audio pulse badge at bottom -->
  <circle cx="240" cy="390" r="4" fill="#4285F4"/>
  <circle cx="256" cy="390" r="5" fill="#34A853"/>
  <circle cx="272" cy="390" r="4" fill="#FBBC05"/>
</svg>
